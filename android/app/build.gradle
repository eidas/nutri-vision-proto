plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.nutrivision.app"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.nutrivision.app"
        minSdk 23          // ML Kit Text Recognition requires API 23+
        targetSdk 34
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source "../.."
}

dependencies {
    // ML Kit Text Recognition (Latin + CJK bundled model)
    implementation "com.google.mlkit:text-recognition:16.0.0"
    // CJK model — required for Japanese label parsing on-device
    implementation "com.google.mlkit:text-recognition-chinese:16.0.0"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.0"
}
